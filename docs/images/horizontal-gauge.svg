<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 215" role="img" aria-label="Schematic horizontal Engine Load gauge showing 68 percent, red daily maximum and white all-time maximum"><rect width="920" height="215" rx="15" fill="#f7f9fc"/><rect x="20" y="22" width="550" height="165" rx="18" fill="#0c1018" stroke="#8d98a5" stroke-width="4"/><text x="48" y="65" font-family="Arial" font-size="28" fill="white" font-weight="bold">ENGINE LOAD</text><text x="537" y="65" font-family="Arial" font-size="30" fill="white" font-weight="bold" text-anchor="end">68%</text><rect x="48" y="105" width="490" height="38" rx="19" fill="#343e4b" stroke="#c5ced8" stroke-width="2"/><rect x="48" y="105" width="333" height="38" rx="19" fill="#e33642"/><path d="M 430 105 l -10 -18 h 20 Z" fill="#f0444b"/><path d="M 479 105 l -10 -18 h 20 Z" fill="white"/><g font-family="Arial" font-size="18" fill="#1b344f"><text x="595" y="62" font-weight="bold">Current: 68%</text><text x="595" y="101">Red: daily MAX (78%)</text><text x="595" y="137">White: all-time MAX (88%)</text><text x="595" y="177">Illustrative 0–100% range</text></g></svg>