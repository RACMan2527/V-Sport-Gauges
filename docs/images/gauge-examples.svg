<g font-family="Arial" fill="#20334d"><text x="445" y="110" font-size="21" font-weight="bold">Marker key</text><path d="M 457 133 L 445 155 L 469 155 Z" fill="white" stroke="#273b52"/><text x="485" y="151" font-size="18">White: all-time maximum = 455</text><path d="M 457 184 L 445 206 L 469 206 Z" fill="#f0444b"/><text x="485" y="202" font-size="18">Red: daily maximum = 300</text><path d="M 457 235 L 445 257 L 469 257 Z" fill="#31d8e6"/><text x="485" y="253" font-size="18">Cyan: daily minimum = 45</text><text x="445" y="294" font-size="16">The red triangle is the same size;</text><text x="445" y="316" font-size="16">its lower value moves it counterclockwise.</text><text x="445" y="348" font-size="16">MAX and MIN are alternative modes on a</text><text x="445" y="370" font-size="16">single round gauge; both are shown here</text><text x="445" y="392" font-size="16">only to explain their meanings.</text></g></svg>